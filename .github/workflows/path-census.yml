name: Runner renew path candidate census
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const token=process.env.ACTIONS_RUNTIME_TOKEN||'', oidc=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
            const seg=oidc.pathname.split('/').filter(Boolean)
            core.info(`oidc_shape=/${seg.map(x=>x.length>16?`[${x.length}]`:x).join('/')}`)
            const p=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'), c=JSON.parse(Buffer.from(p,'base64').toString('utf8'))
            const body=JSON.stringify({planId:c.plan_id,jobId:c.job_id})
            const paths=new Set(['/renewjob'])
            if(seg.length){paths.add(`/${seg[0]}/renewjob`)}
            if(seg.length>1){paths.add(`/${seg[0]}/${seg[1]}/renewjob`);paths.add(`/${seg[0]}/renewjob/${seg.slice(2).join('/')}`)}
            if(seg.length>2){paths.add(`/${seg.slice(0,-2).join('/')}/renewjob`);paths.add(`/${seg.slice(0,-2).join('/')}/renewjob/${seg.slice(-2).join('/')}`)}
            let i=0
            for(const path of paths){
              const u=new URL(path,oidc.origin)
              let status='ERR',txt=''
              try{const r=await fetch(u,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body});status=r.status;txt=(await r.text()).slice(0,160)}catch(e){txt=e.name}
              core.info(`candidate${i++} shape=/${path.split('/').filter(Boolean).map(x=>x.length>16?`[${x.length}]`:x).join('/')} status=${status} body=${txt}`)
            }
